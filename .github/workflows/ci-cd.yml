name: Build, Scan, and Deploy
on:
  push:
    branches: [ "main", "master" ]
env:
  REGISTRY: ghcr.io
jobs:
  build-scan-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [vote, result, worker]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          docker build -t ${{ env.REGISTRY }}/chibliss19/voting-${{ matrix.service }}:${{ github.sha }} ./${{ matrix.service }}
          docker push ${{ env.REGISTRY }}/chibliss19/voting-${{ matrix.service }}:${{ github.sha }}
